{% extends 'base.html' %}
{% block title %}Students{% endblock %}
{% block page_title %}Student Management{% endblock %}
{% block content %}
<div class="card glass">
  <div class="toolbar">
    <input id="studentSearch" placeholder="Search students..." />
    <button onclick="loadStudents()">Search</button>
  </div>
  <form id="studentForm" class="inline-form">
    <input name="name" placeholder="Name" required />
    <input name="class" placeholder="Class" required />
    <input name="roll" placeholder="Roll" required />
    <input name="phone" placeholder="Phone" />
    <input name="email" placeholder="Email" />
    <input name="parent" placeholder="Parent Name" />
    <button type="submit">Add Student</button>
  </form>
  <div class="table-wrap"><table id="studentsTable"></table></div>
</div>
{% endblock %}
