<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | ASWATHAMA CLASSES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="login-body">
  <div class="login-card glass fade-in">
    <h1>ASWATHAMA CLASSES</h1>
    <p>Premium AI-powered coaching platform</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <label>Role</label>
      <select name="role" required>
        <option value="teacher">Teacher (Admin)</option>
        <option value="student" selected>Student (User)</option>
      </select>
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter username" required />
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter password" required />
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
